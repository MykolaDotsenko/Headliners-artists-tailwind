name: Bootstrap polish lock

on:
  push:
    branches:
      - refactor/recruiter-grade-headliners

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'lock browser quality toolchain')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Add pinned quality tooling to working package metadata
        run: |
          npm pkg set "devDependencies.@playwright/test=1.63.0"
          npm pkg set "devDependencies.@axe-core/playwright=4.13.0"
          npm pkg set "devDependencies.@lhci/cli=0.15.1"
          npm pkg set "devDependencies.sharp=0.35.4"

      - name: Resolve deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock browser quality toolchain [skip ci]"
          git push
