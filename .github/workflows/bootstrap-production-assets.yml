name: Bootstrap production assets

on:
  push:
    branches:
      - refactor/recruiter-grade-headliners

permissions:
  contents: write

jobs:
  persist-assets:
    if: "!contains(github.event.head_commit.message, 'persist production assets')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build responsive production media
        run: npm run assets:build

      - name: Install Chromium for deterministic screenshots
        run: npx playwright install --with-deps chromium

      - name: Capture portfolio screenshots
        run: npm run screenshots

      - name: Persist generated production evidence
        run: |
          mkdir -p docs/screenshots
          cp artifacts/screenshots/headliners-desktop.jpg docs/screenshots/headliners-desktop.jpg
          cp artifacts/screenshots/headliners-mobile.jpg docs/screenshots/headliners-mobile.jpg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/source src/assets/optimized docs/screenshots
          git commit -m "chore: persist production assets and screenshots"
          git push
